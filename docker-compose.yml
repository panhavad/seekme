services:
  seekme:
    build:
      context: .
    image: seekme:latest
    container_name: seekme
    restart: unless-stopped
    ports:
      - "${SEEKME_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      PUBLIC_DIR: "/app/dist"
      DATA_DIR: "/data"
    volumes:
      - seekme-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  seekme-data:
